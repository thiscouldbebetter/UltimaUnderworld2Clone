
<html>

<body>

<div>
	<h3>ARK File Decompressor</h3>

	<p>Upload a file in compressed .ark file format to decompress it.</p>

	<div>
		<label>File to Upload:</label>
		<input type="file" onchange="inputFile_Changed(this)">
	</div>

	<div>
		<label>File Contents Decompressed as Bytes:<label>
		<br />
		<textarea
			id="textareaBytesDecompressed"
			cols="80" rows="25"
			spellcheck="false"
		></textarea>
	</div>
</div>

<script type="text/javascript">

function inputFile_Changed(inputFile)
{
	var file = inputFile.files[0];
	if (file != null)
	{
		var fileReader = new FileReader();
		fileReader.onload = (event) =>
		{
			var fileAsBinaryString = event.target.result;
			var arkFileAsBytes =
				fileAsBinaryString
					.split("")
					.map(x => x.charCodeAt(0) );
			var arkFile = ArkFile.fromBytes(arkFileAsBytes);
			var arkFileAsString = arkFile.toString();
			var d = document;
			var textareaBytesDecompressed =
				d.getElementById("textareaBytesDecompressed");
			textareaBytesDecompressed.value =
				arkFileAsString;
		};
		fileReader.readAsBinaryString(file);
	}
}

class ArkFile
{
	constructor(blocks)
	{
		this.blocks = blocks;
	}

	static fromBytes(bytesToDecompress)
	{
		var bytesDecompressed = [];

		var reader = new ByteStream(bytesToDecompress);
		var converter = new ByteConverter();

		var blocksPerTable = converter.bytesToIntegerLE(reader.readBytes(2) );
		var unknownAsBytes = reader.readBytes(4);
		var unknownAsInteger = converter.bytesToIntegerLE(unknownAsBytes);
		if (unknownAsInteger != 0)
		{
			alert("Unknown field should be all zeroes, but wasn't.");
		}

		var blockOffsetsAbsolute = [];

		for (var i = 0; i < blocksPerTable; i++)
		{
			var blockOffsetAbsolute =
				converter.bytesToIntegerLE(reader.readBytes(4) );
			if (blockOffsetAbsolute == 0)
			{
				console.log("Offset for block " + i + " was 0, which was not yet used.");
			}
			blockOffsetsAbsolute.push(blockOffsetAbsolute);
		}

		var blockFlagSets = [];

		for (var i = 0; i < blocksPerTable; i++)
		{
			var flagsAsByte = reader.readByte();
			var padding = reader.readBytes(3);
			var blockFlags = ArkFile_Block_Flags.fromByte(flagsAsByte);
			blockFlagSets.push(blockFlags);
		}

		var blockSizes = [];
		for (var i = 0; i < blocksPerTable; i++)
		{
			var blockSize =
				converter.bytesToIntegerLE(reader.readBytes(4) );
			blockSizes.push(blockSize);
		}

		var blockAvailableSpaces = [];
		for (var i = 0; i < blocksPerTable; i++)
		{
			var blockAvailableSpace =
				converter.bytesToIntegerLE(reader.readBytes(4) );
			blockAvailableSpaces.push(blockAvailableSpace);
		}

		var blocks = [];
		for (var i = 0; i < blocksPerTable; i++)
		{
			var blockOffsetAbsolute = blockOffsetsAbsolute[i];
			var blockFlags = blockFlagSets[i];
			var blockSize = blockSizes[i];
			var blockAvailableSpace = blockAvailableSpaces[i];

			reader.seek(blockOffsetAbsolute);
			var blockDataPadded = 
				reader.readBytes(blockAvailableSpace);
			var blockDataTrimmed =
				blockDataPadded.slice(0, blockSize);

			var block = new ArkFile_Block
			(
				blockOffsetAbsolute,
				blockFlags,
				blockSize,
				blockAvailableSpace,
				blockDataTrimmed
			);

			blocks.push(block);
		}

		var arkFile = new ArkFile(blocks);

		return arkFile;
	}

	toObjectToSerialize()
	{
		var returnValue = {};
		var blocksAsObjectsToSerialize =
			this.blocks.map(x => x.toObjectToSerialize() );
		returnValue.blocks = blocksAsObjectsToSerialize;
		return returnValue;
	}

	toString()
	{
		var objectToSerialize = this.toObjectToSerialize();
		return JSON.stringify(objectToSerialize, null, 4);
	}
}

class ArkFile_Block
{
	constructor(offset, flags, size, spaceAvailable, dataBytes)
	{
		this.offset = offset;
		this.flags = flags;
		this.size = size;
		this.spaceAvailable = spaceAvailable;
		this.dataBytes = dataBytes;

		this.payload =
			ArkFile_Block_Payload.fromBytesCompressed(this.dataBytes);
	}

	toObjectToSerialize()
	{
		var dataBytesAsHexadecimal = this.dataBytes.map
		(
			x => x.toString(16).padStart(2, "0")
		).join("");

		var returnValue =
		{
			offset: this.offset,
			flags: this.flags,
			size: this.size,
			spaceAvailable: this.spaceAvailable,
			dataBytes: dataBytesAsHexadecimal
		};
		return returnValue;
	}
}

class ArkFile_Block_Flags
{
	constructor(shouldBeCompressed, isActuallyCompressed, extraSpaceIsAllocated)
	{
		this.shouldBeCompressed = shouldBeCompressed;
		this.isActuallyCompressed = isActuallyCompressed;
		this.extraSpaceIsAllocated = extraSpaceIsAllocated;
	}

	static fromByte(flagsAsByte)
	{
		var flagsAsBitString = flagsAsByte.toString(2);
		var flagsAsBitStrings = flagsAsBitString.split("");
		var shouldBeCompressed = (flagsAsBitStrings[0] == "1");
		var isActuallyCompressed = (flagsAsBitStrings[1] == "1");
		var extraSpaceIsAllocated = (flagsAsBitStrings[2] == "1");
		var flags = new ArkFile_Block_Flags
		(
			shouldBeCompressed, isActuallyCompressed, extraSpaceIsAllocated
		);
		return flags;
	}
}

class ArkFile_Block_Payload
{
	constructor(subblocks)
	{
		this.subblocks = subblocks;
	}

	static fromBytesCompressed(bytes)
	{
		var reader = ByteStream.fromBytes(bytes);
		var compressedBlockTagToIgnore = reader.readBytes(4);
		var converter = new ByteConverter();

		var blockHasMoreSubblocks = true;
		while (blockHasMoreSubblocks)
		{
			var subblocksAreTransfersToBufferNotCopyRecordsAsByte =
				reader.readByte();
			var bitStream = BitStream.fromBytes
			(
				[ subblocksAreTransfersToBufferNotCopyRecordsAsByte ]
			);
			for (var i = 0; i < 8; i++)
			{
				var subblockIsTransferToBufferNotCopyRecords =
					(bitStream.readBit() == 1);
				if (subblockIsTransferToBufferNotCopyRecords)
				{
					throw new Error("todo - Transfer to buffer.");
				}
				else
				{
					// Copy record.

					var positionAndCopyCountAsBytes =
						reader.readBytes(2);
					var bitStreamForPosAndCopyCount =
						BitStream.fromBytes(positionAndCopyCountAsBytes);

					var positionAsBits = bitStreamForPosAndCopyCount.readBits(11);
					var positionAbsolute = 
						converter
							.bitsToIntegerLE(bitStreamForPosAndCopyCount);
					var positionSignAsBit =
						bitStreamForPosAndCopyCount.readBit();
					var positionSign =
						positionSignAsBit == "1"
						? -1
						: 1;
					var positionBeforeOffset = positionSign * positionAbsolute;
					const positionOffset = 18;
					var position = positionBeforeOffset + positionOffset;

					var copyCountAsBits = bitStream.readBits(4);
					var copyCountBeforeOffset =
						converter.bitsToIntegerLE(copyCountAsBits);
					const copyCountOffset = 3;
					var copyCount = copyCountBeforeOffset + copyCountOffset;

					var message =
						"position is " + position
						+ ", copyCount is " + copyCount;

					throw new Error(message);
				}
			}
		}
	}
}

class ArkFile_Block_Payload_CopyRecord
{
	constructor(position, copyCount)
	{
		this.position = position;
		this.copyCount = copyCount;
	}
}

class ArkFile_Block_Payload_TransferToBuffer
{
	constructor(data)
	{
		this.data = data;
	}
}

class ByteConverter
{
	static BitsPerByte = 8;

	bitsToIntegerLE(bitsToConvert)
	{
		// "LE" = "Little-Endian",
		// which is more usually applied to bytes, not bits.

		var integerSoFar = 0;

		for (var i = 0; i < bitsToConvert.length; i++)
		{
			integerSoFar = integerSoFar << 1;
			var bitToConvert = bitsToConvert[i];
			integerSoFar += bitToConvert;
		}

		return integerSoFar;
	}

	bytesToIntegerLE(bytesToConvert)
	{
		// "LE" = "Little-Endian".
		var integerSoFar = 0;

		for (var i = 0; i < bytesToConvert.length; i++)
		{
			var byteToConvert = bytesToConvert[i];
			var byteValueInPlace =
				byteToConvert << (ByteConverter.BitsPerByte * i);
			integerSoFar += byteValueInPlace;
		}

		return integerSoFar;
	}
}

class BitStream
{
	constructor(bytes)
	{
		this.byteStream = ByteStream.fromBytes(bytes)
		this.bitOffsetWithinByte = 0; // Lowest-order bit first.
	}

	static fromBytes(bytes)
	{
		return new BitStream(bytes);
	}

	static BitsPerByte = 8;

	readBit()
	{
		var byteCurrent = this.byteStream.peek();
		var bitRead = (byteCurrent >> this.bitOffsetWithinByte) & 1;
		this.bitOffsetWithinByte++;

		if (this.bitOffsetWithinByte >= BitStream.BitsPerByte)
		{
			this.byteStream.readByte();
			this.bitOffsetWithinByte = 0;
		}

		return bitRead;
	}

	readBits(bitCount)
	{
		var bitsReadSoFar = [];

		for (var i = 0; i < bitCount; i++)
		{
			var bitRead = this.readBit();
			bitsReadSoFar.push(bitRead);
		}

		return bitsReadSoFar;
	}
}

class ByteStream
{
	constructor(bytes)
	{
		this.bytes = bytes;

		this.byteCurrentIndex = 0;
	}

	static fromBytes(bytes)
	{
		return new ByteStream(bytes);
	}

	peek()
	{
		var byteCurrent = this.bytes[this.byteCurrentIndex];
		return byteCurrent;
	}

	readByte()
	{
		var byteRead = this.bytes[this.byteCurrentIndex];
		this.byteCurrentIndex++;
		return byteRead;
	}

	readBytes(byteCount)
	{
		var bytesRead = [];
		for (var i = 0; i < byteCount; i++)
		{
			var byteRead = this.readByte();
			bytesRead.push(byteRead);
		}
		return bytesRead;
	}

	seek(byteIndexToSet)
	{
		this.byteCurrentIndex = byteIndexToSet;
		return this;
	}
}

</script>

</body>

</html>
